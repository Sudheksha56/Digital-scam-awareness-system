<!DOCTYPE html>
<html>
<head>
    <title>View Reports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Reported Scam List</h1>

<table border="1">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Scam Type</th>
    <th>Status</th>
    <th>Update Status</th>
    <th>Edit</th>
    <th>Delete</th>
</tr>

{% for report in reports %}
<tr>
    <td>{{ report[0] }}</td>
    <td>{{ report[1] }}</td>
    <td>{{ report[2] }}</td>
    <td>{{ report[3] }}</td>
    <td>{{ report[4] }}</td>
    <td>{{ report[5] }}</td>
<td>
    <a href="/update_status/{{ report[0] }}">Update</a>
</td>
<td>
    <a href="/edit_report/{{ report[0] }}">Edit</a>
</td>

<td>
    <a href="/delete_report/{{ report[0] }}">Delete</a>
</td>
</tr>
{% endfor %}

</table>

<br>

<a href="/dashboard">Back to Dashboard</a>

</body>
</html>
