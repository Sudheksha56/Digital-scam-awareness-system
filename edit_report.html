<!DOCTYPE html>
<html>
<head>
    <title>Edit Report</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Edit Report</h1>

<form method="POST">

    Name:<br>
    <input type="text" name="name" value="{{ report[1] }}"><br><br>

    Email:<br>
    <input type="text" name="email" value="{{ report[2] }}"><br><br>

    Phone:<br>
    <input type="text" name="phone" value="{{ report[3] }}"><br><br>

    Scam Type:<br>
    <input type="text" name="scamtype" value="{{ report[4] }}"><br><br>

    <input type="submit" value="Update Report">

</form>

</body>
</html>
