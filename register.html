<!DOCTYPE html>
<html>

<head>

<title>Register</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='auth.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="left">

<img src="{{ url_for('static', filename='images/logo.png') }}" class="logo">

<h1>Digital Scam Awareness</h1>

<p>Create your account to report scams and stay protected.</p>

</div>

<div class="right">

<div class="form-box">

<h2>Create Account</h2>

<form method="POST">

<input type="text"
name="name"
placeholder="Full Name"
required>

<input type="email"
name="email"
placeholder="Email"
required>

<input type="password"
name="password"
placeholder="Password"
required>

<button>

Register

</button>

</form>

<p>

Already have an account?

<a href="/login">

Login

</a>

</p>

</div>

</div>

</div>

</body>

</html>
